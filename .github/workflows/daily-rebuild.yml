# Rebuilds the live site every morning so new Substack posts appear on mindofkv.com
# (the Writing page and RSS feed are generated from the Substack feed at build time).
#
# Setup (once): in Vercel → Project → Settings → Git → Deploy Hooks, create a hook for "main",
# then add its URL in GitHub → Settings → Secrets and variables → Actions as VERCEL_DEPLOY_HOOK.
name: Daily rebuild

on:
  schedule:
    - cron: '17 1 * * *' # 01:17 UTC every day
  workflow_dispatch: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "VERCEL_DEPLOY_HOOK secret not set yet; skipping."; exit 0; fi
          curl -fsS -X POST "$HOOK"
